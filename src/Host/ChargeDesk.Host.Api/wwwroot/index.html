<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Autor: Anderson Pereira Silva | 29/07/2026 | Shell SPA MVP ChargeDesk Platform -->
  <title>ChargeDesk Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/app.css?v=1" rel="stylesheet" />
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-card card shadow">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">ChargeDesk Platform</h1>
        <p class="text-muted small mb-3">Carregamento · Estacionamento · Caixa</p>
        <div class="mb-2">
          <label class="form-label">Login</label>
          <input id="loginUser" class="form-control" value="admin" autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input id="loginPass" type="password" class="form-control" value="admin123" autocomplete="current-password" />
        </div>
        <button id="btnLogin" class="btn btn-primary w-100">Entrar</button>
        <div id="loginErr" class="text-danger small mt-2"></div>
      </div>
    </div>
  </div>

  <div id="appView" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark bg-navy">
      <div class="container-fluid">
        <span class="navbar-brand">ChargeDesk Platform</span>
        <div class="d-flex gap-2 align-items-center">
          <span id="userLabel" class="text-white-50 small"></span>
          <button id="btnLogout" class="btn btn-sm btn-outline-light">Sair</button>
        </div>
      </div>
    </nav>
    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-2 sidebar py-3">
          <button class="nav-link-btn" data-page="dashboard">Painel</button>
          <button class="nav-link-btn" data-page="caixa">Caixa</button>
          <button class="nav-link-btn" data-page="atendimentos">Atendimentos</button>
          <button class="nav-link-btn" data-page="estacionamento">Estacionamento</button>
          <button class="nav-link-btn" data-page="clientes">Clientes</button>
          <button class="nav-link-btn" data-page="veiculos">Veículos</button>
        </aside>
        <main class="col-md-10 py-3" id="page"></main>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js?v=2"></script>
</body>
</html>
